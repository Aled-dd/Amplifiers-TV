<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gospel Amplifiers TV | Where Faith Comes Alive</title>
    <meta name="description" content="Premium Nigerian Christian movie and media streaming platform producing faith-based drama, spiritual warfare series, and gospel content." />
    <meta property="og:title" content="Remix Gospel Amplifiers TV | Where Faith Comes Alive" />
    <meta property="og:description" content="Premium Nigerian Christian movie and media streaming platform producing faith-based drama, spiritual warfare series, and gospel content." />
    <script>
      (function() {
        try {
          let customFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return customFetch;
            },
            set(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Fallback for GitHub Pages if repo is served directly from root without a build step
        if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
          window.addEventListener('DOMContentLoaded', function() {
            var devScript = document.querySelector('script[src*="main.tsx"]');
            if (devScript) {
              var path = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
              window.location.replace(path + 'docs/' + window.location.search + window.location.hash);
            }
          });
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0D0D0D] text-[#FAF8F3] antialiased selection:bg-[#D4AF37] selection:text-[#0D0D0D]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
